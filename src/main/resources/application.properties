spring.application.name=demo
spring.config.import=optional:application-secret.properties
spring.datasource.url=jdbc:mysql://localhost:3306/spring?serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# [7주차 연습문제] 오류 응답 JSON 에 trace(서버 내부 정보)를 노출하지 않음
server.error.include-stacktrace=never

# [11주차] 단계 2 : 파일 업로드 크기 (기본값 : 파일 1MB, 요청 전체 10MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# [디자인 개선] 정적 파일(css · js) 캐시 문제 해결 : 파일 내용으로 만든 해시를 주소에 붙인다
# @{/css/theme.css} → /css/theme-<해시>.css  : 파일이 바뀌면 주소도 바뀌어서 브라우저가 옛 파일을 쓰지 않는다
# (이 설정이 없으면 브라우저가 옛 css 를 쓰고 새 js 만 받아, 왼쪽 아래 버튼이 겹쳐 보이는 일이 생겼다)
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
