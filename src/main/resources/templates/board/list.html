<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>게시판 - First Portfolio</title>

        <!-- [9주차 제공 → 10 · 11 · 12주차 수정] 게시판 목록 : 페이지 번호 + 검색 + 모집 표시 + 실시간 -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
        <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">
        <link th:href="@{/css/board.css}" rel="stylesheet">
        <!-- [디자인 1단계] 라이트 · 다크 모드 테마 (board.css 뒤에 연결해서 덮어쓴다) + 모드 정하기 스크립트 -->
        <link th:href="@{/css/theme.css}" rel="stylesheet">
        <script th:src="@{/js/theme.js}"></script>
    </head>

    <body>
        <header class="board-header">
            <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <a th:href="@{/}" class="small"><i class="bi-house me-1"></i>메인으로</a>
                    <!-- listTitle 이 없으면 "게시판" ("내가 쓴 글" 화면에서 다시 사용) -->
                    <h1 class="mt-1"><i class="bi-chat-square-text me-2"></i><span th:text="${listTitle ?: '게시판'}">게시판</span></h1>
                </div>
                <!-- <div class="d-flex align-items-center gap-3"> -->
                <!-- [반응형 1단계] flex-wrap : 휴대폰에서 버튼이 많으면 다음 줄로 내려간다 -->
                <div class="d-flex flex-wrap align-items-center gap-2 gap-md-3">
                    <!-- [12주차] 실시간 연결 상태 + 내 알림 종 (로그인했을 때만) -->
                    <span id="rt-status" class="rt-status">○ 실시간</span>
                    <span id="noti-bell" sec:authorize="isAuthenticated()" class="noti-bell"><i class="bi-bell"></i><span id="noti-count" class="badge bg-danger" hidden>0</span></span>
                    <th:block sec:authorize="isAuthenticated()">
                        <span><i class="bi-person-circle me-1"></i><strong sec:authentication="name">user</strong>님</span>
                        <!-- <a th:href="@{/board/my}" class="btn btn-light btn-sm-custom"><i class="bi-person-lines-fill me-1"></i>내가 쓴 글</a> -->
                        <!-- [9주차 개선 ①] 내가 쓴 글 화면(myList)이면 "전체 글 보기", 아니면 "내가 쓴 글" 버튼 -->
                        <a th:unless="${myList}" th:href="@{/board/my}" class="btn btn-light btn-sm-custom"><i class="bi-person-lines-fill me-1"></i>내가 쓴 글</a>
                        <a th:if="${myList}" th:href="@{/board}" class="btn btn-light btn-sm-custom"><i class="bi-list-ul me-1"></i>전체 글 보기</a>
                        <!-- [11주차] 신청 바구니 : 세션에 담긴 개수 (session.cart) -->
                        <a th:href="@{/cart}" class="btn btn-light btn-sm-custom"><i class="bi-basket me-1"></i>신청 바구니
                            <span class="badge bg-danger" th:if="${session.cart != null and !session.cart.isEmpty()}" th:text="${session.cart.size()}">0</span></a>
                    </th:block>
                    <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-light btn-sm-custom"><i class="bi-box-arrow-in-right me-1"></i>로그인</a>
                </div>
            </div>
        </header>

        <main class="board-body">
            <div class="container">
                <!-- 처리 결과 메시지 -->
                <div th:if="${param.deleted}" class="alert alert-secondary py-2"><i class="bi-trash me-1"></i> 글이 삭제되었습니다.</div>

                <div class="board-card">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                        <h5 class="m-0">
                            <i class="bi-list-ul me-2"></i>글 목록
                            <!-- 글 수 : page 가 있으면(10주차 페이징) 전체 글 수, 없으면 posts 목록의 크기 -->
                            <small class="text-muted" th:text="|전체 ${page != null ? page.totalElements : #lists.size(posts)}개|">전체 0개</small>
                        </h5>
                        <!-- <div class="d-flex flex-wrap align-items-center gap-2"> -->
                        <!-- [반응형 1단계] board-list-tools : 휴대폰에서 검색창 · 글쓰기 줄을 카드 전체 너비로 -->
                        <div class="d-flex flex-wrap align-items-center gap-2 board-list-tools">
                            <!-- [10주차] 검색 : GET /board?keyword=검색어 ("내가 쓴 글" 화면에서는 숨김) -->
                            <form th:if="${listTitle == null}" th:action="@{/board}" method="get" class="d-flex gap-2 board-search">
                                <!-- [10주차 연습문제 2] 컨트롤러가 type 을 넘겨주면 검색 범위 선택 상자가 보인다 -->
                                <select th:if="${type != null}" name="type" class="form-select form-select-sm">
                                    <option value="all" th:selected="${type == 'all'}">제목+내용</option>
                                    <option value="writer" th:selected="${type == 'writer'}">작성자</option>
                                </select>
                                <input type="search" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="검색어 입력">
                                <!-- <button type="submit" class="btn btn-outline-primary btn-sm-custom text-nowrap"><i class="bi-search me-1"></i>검색</button> -->
                                <!-- [반응형 1단계] 아주 좁은 화면(576px 미만)에서는 돋보기 아이콘만 보여서 입력칸이 넓어진다 -->
                                <button type="submit" class="btn btn-outline-primary btn-sm-custom text-nowrap" aria-label="검색"><i class="bi-search"></i><span class="d-none d-sm-inline ms-1">검색</span></button>
                            </form>
                            <!-- 글쓰기 버튼 : 로그인한 사람에게만 보인다 (5주차 sec:authorize) -->
                            <a sec:authorize="isAuthenticated()" th:href="@{/board/write}" class="btn btn-primary btn-sm-custom text-nowrap"><i class="bi-pencil me-1"></i>글쓰기</a>
                        </div>
                    </div>

                    <!-- [10주차] 검색 중일 때 안내 + 전체 목록으로 돌아가기 -->
                    <div th:if="${keyword != null and !#strings.isEmpty(keyword)}" class="search-info mb-3">
                        <i class="bi-search me-1"></i><strong th:text="|'${keyword}'|">'스프링'</strong> 검색 결과
                        <strong th:text="${page != null ? page.totalElements : #lists.size(posts)}">0</strong>개
                        <a th:href="@{/board}" class="ms-2 small">전체 목록 보기</a>
                    </div>

                    <div class="table-responsive">
                        <!-- <table class="table table-hover mb-0 board-table"> -->
                        <!-- [반응형 1단계] board-list : 휴대폰에서는 표 대신 한 글 = 한 칸(제목 + 작은 정보 줄)으로 보인다 -->
                        <table class="table table-hover mb-0 board-table board-list">
                            <thead>
                                <tr><th style="width: 80px">번호</th><th>제목</th><th style="width: 130px">작성자</th><th style="width: 150px">작성일</th><th style="width: 80px">조회</th></tr>
                            </thead>
                            <tbody>
                                <!-- posts : 컨트롤러가 넘겨준 글 목록 -->
                                <tr th:each="post : ${posts}">
                                    <td th:text="${post.id}">1</td>
                                    <td class="text-start">
                                        <!-- [11주차] 모집글 표시 : 모집 중 (신청/정원) 또는 마감 -->
                                        <!-- [12주차] data-seat-post : 실시간 남은 자리 메시지가 오면 이 글자가 바뀐다 -->
                                        <span th:if="${post.recruit}" class="recruit-badge me-1" th:classappend="${post.full} ? 'closed'"
                                              th:attr="data-seat-post=${post.id}" data-field="badge-list"
                                              th:text="${post.full} ? '마감' : |모집 ${post.appliedCount}/${post.capacity}|">모집 0/5</span>
                                        <a th:href="@{/board/{id}(id=${post.id})}" th:text="${post.title}" class="board-title">제목</a>
                                        <!-- [10주차 단계 5] @OneToMany 로 글 → 댓글 목록을 꺼낼 수 있다 : 댓글 수 -->
                                        <span th:if="${post.comments.size() > 0}" class="comment-count" th:text="|[${post.comments.size()}]|">[3]</span>
                                        <span th:if="${post.updatedAt != null}" class="edited-badge">수정됨</span>
                                    </td>
                                    <!-- post.author.name : 글 → 작성자(Member) → 이름 (@ManyToOne 덕분에 객체로 따라간다) -->
                                    <td th:text="${post.author.name}">홍길동</td>
                                    <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-20 10:00</td>
                                    <td th:text="${post.viewCount}">0</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(posts)}">
                                    <td colspan="5" class="text-muted py-4" th:text="${keyword != null and !#strings.isEmpty(keyword)} ? '검색 결과가 없습니다.' : '아직 글이 없습니다. 첫 글을 써 보세요!'">아직 글이 없습니다.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- [10주차] 페이지 번호 : page 가 있을 때만. page.number 는 0 부터, 화면에는 1 부터 표시 -->
                    <!-- 링크에 keyword·type 을 함께 붙여서, 검색 결과의 2페이지도 검색 결과로 이어지게 한다 -->
                    <nav th:if="${page != null and page.totalPages > 1}" class="mt-4"
                         th:with="url=${pageUrl ?: '/board'},
                                  start=${T(java.lang.Math).max(0, page.number - 2)},
                                  end=${T(java.lang.Math).min(page.totalPages - 1, page.number + 2)}">
                        <ul class="pagination justify-content-center mb-0">
                            <!-- [게시판 개선] 첫 페이지로 : page=0. 이미 첫 페이지면 disabled (누를 수 없음)
                                 휴대폰(576px 미만)에서는 « 아이콘만 보여서 한 줄에 들어간다 -->
                            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                                <a class="page-link" th:href="@{${url}(page=0,keyword=${keyword},type=${type})}"
                                   title="첫 페이지" aria-label="첫 페이지"><i class="bi-chevron-double-left"></i><span class="d-none d-sm-inline ms-1">처음</span></a>
                            </li>
                            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                                <!-- <a class="page-link" th:href="@{${url}(page=${page.number - 1},keyword=${keyword},type=${type})}">이전</a> -->
                                <!-- [게시판 개선] 처음 · 끝 버튼이 늘어서 휴대폰에서는 ‹ 아이콘만 (PC 는 "이전" 글자도) -->
                                <a class="page-link" th:href="@{${url}(page=${page.number - 1},keyword=${keyword},type=${type})}"
                                   title="이전 페이지" aria-label="이전 페이지"><i class="bi-chevron-left d-sm-none"></i><span class="d-none d-sm-inline">이전</span></a>
                            </li>
                            <!-- <li class="page-item" th:each="i : ${#numbers.sequence(start, end)}" th:classappend="${i == page.number} ? 'active'"> -->
                            <!-- [게시판 개선] 현재 페이지에서 2칸 떨어진 번호에 page-far 를 붙인다 → 휴대폰에서는 숨겨서(board.css) 한 줄에 들어가게 -->
                            <li class="page-item" th:each="i : ${#numbers.sequence(start, end)}"
                                th:classappend="${(i == page.number ? 'active' : '') + (T(java.lang.Math).abs(i - page.number) >= 2 ? ' page-far' : '')}">
                                <a class="page-link" th:href="@{${url}(page=${i},keyword=${keyword},type=${type})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                                <!-- <a class="page-link" th:href="@{${url}(page=${page.number + 1},keyword=${keyword},type=${type})}">다음</a> -->
                                <a class="page-link" th:href="@{${url}(page=${page.number + 1},keyword=${keyword},type=${type})}"
                                   title="다음 페이지" aria-label="다음 페이지"><span class="d-none d-sm-inline">다음</span><i class="bi-chevron-right d-sm-none"></i></a>
                            </li>
                            <!-- [게시판 개선] 끝 페이지로 : page = 전체 페이지 수 - 1 (page 는 0 부터 세기 때문). 이미 끝이면 disabled -->
                            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                                <a class="page-link" th:href="@{${url}(page=${page.totalPages - 1},keyword=${keyword},type=${type})}"
                                   title="끝 페이지" aria-label="끝 페이지"><span class="d-none d-sm-inline me-1">끝</span><i class="bi-chevron-double-right"></i></a>
                            </li>
                        </ul>
                        <p class="text-center text-muted small mt-2 mb-0" th:text="|${page.number + 1} / ${page.totalPages} 페이지|">1 / 1 페이지</p>
                    </nav>
                </div>
            </div>
        </main>
        <!-- [12주차] 실시간 알림 : STOMP 라이브러리 + 연결 · 구독 스크립트 -->
        <div id="toast-area" class="toast-area"></div>
        <script th:src="@{/js/stomp.umd.min.js}"></script>
        <script th:src="@{/js/realtime.js}"></script>

        <!-- [9주차 개선 ②] 뒤로가기로 돌아왔을 때 조회수가 바로 반영되도록 -->
        <script>
            // 브라우저의 뒤로/앞으로 캐시(bfcache)는 서버에 다시 묻지 않고 이전 화면을 메모리에서 그대로 꺼낸다.
            // persisted = true 이면 캐시에서 꺼낸 화면이므로 새로고침해서 최신 목록(조회수 · 신청 인원)을 다시 받는다.
            window.addEventListener('pageshow', function (event) {
                if (event.persisted) {
                    location.reload();
                }
            });
        </script>
    </body>
</html>
